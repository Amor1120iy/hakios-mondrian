# devices/mondrian/device.conf: what this device repository is (docs/porting/repositories.md has every word).
# The status lines are the honest state of the port: a driver is "works" only once it has been seen working on
# this phone. Everything below that says "partial" or "missing" is what the porting order (docs/porting/index.md)
# asks for next; devices/mondrian/README.md says file by file what has to change for it.

device mondrian
	title       Redmi K60
	vendor      Xiaomi
	soc         sm8475
	defconfig   mondrian_defconfig
	firmware    pull-firmware.sh
	maintainer  the port's own tree (devices/mondrian/README.md)
	status      display     partial   the panel through UEFI's framebuffer, at 1440x3200 (to be checked on the phone)
	status      touch       missing   Goodix on QUP4 (gpio16-19, irq 21, reset 20, avdd 71): the driver's pins are the POCO X5 Pro's
	status      buttons     partial   volume through PM8350's gpio 6 and the power key through PMK8350; the arbiter moved
	status      cpu         partial   all 8 cores; the frequency block is at 0x17d91000 (soc_epss=) and its memory votes use MC3/SH5
	status      gpu         missing   Adreno 730; hakios-metal knows one chip (0x06030500) and hakios.adreno.c one GPU (642L)
	status      storage     partial   UFS at 0x1d84000, the same phy as the reference phone; not seen reading yet
	status      audio       missing   AW882XX amplifiers, not the reference phone's Cirrus; the DSP's firmware is not pulled
	status      battery     missing   through the audio DSP, as on the reference phone: the DSP is not up yet
	status      haptic      missing   PM8350B's hh-haptics (not an AW86927): no driver yet
	status      camera      missing   the reference phone's sensors only
	status      torch       missing   the PM8350C flash LED; the driver is the reference phone's
	status      wifi        missing   WCN6856 (the reference phone has a WCN6750): ath11k, different firmware and board data
	status      bluetooth   missing   step one only, and the pins are the reference phone's
	status      cellular    missing   the modem is at 0x8bc00000 with its IPA at 0x3e00000: the addresses are in, the driver is not on
	status      thermal     works     tsens at 0xc263000 / 0xc265000, the same two blocks as the reference phone; the 32-channel SM8475 map is chosen by thermal_map=sm8475 (read from the phone's own tree, not yet seen running)
	status      usb         missing   not looked at
	status      sensors     missing   not looked at
