# devices/mondrian/soc/soc.conf: what this SoC repository is -- the facts of a Qualcomm SM8475 ("cape"),
# whatever phone it is in. devices/mondrian/configs/mondrian_defconfig includes configs/sm8475.config from here.

soc sm8475
	title       Qualcomm SM8475 family (Snapdragon 8+ Gen 1; "cape", "cape-v2")
	vendor      Qualcomm
	cores       8, the biggest is core 7 (1 Cortex-X2, 3 Cortex-A710, 4 Cortex-A510)
	gpu         Adreno 730
	maintainer  the port's own tree (devices/mondrian/README.md)
